{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<header class="head"><h1>Change password</h1></header>
<form method="post" class="card form">{% csrf_token %}
  <div class="field"><label>Current password</label><input type="password" name="current" required></div>
  <div class="field"><label>New password</label><input type="password" name="new" minlength="8" required></div>
  <div class="actions"><button class="btn">Update password</button><a class="btn ghost" href="{% url 'dashboard' %}">Cancel</a></div>
</form>{% endblock %}
